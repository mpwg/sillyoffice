[workspace]
members = ["crates/sim-core", "crates/sim-cli", "crates/sim-godot"]
default-members = ["crates/sim-core", "crates/sim-cli"]
resolver = "3"

[workspace.package]
edition = "2024"
publish = false

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
sim-core = { path = "crates/sim-core" }
